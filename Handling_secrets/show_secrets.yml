- name: Display secrets
  hosts: servers
  become: yes

  vars_files:
    - secrets.yaml

  tasks:
    - name: Display Name
      debug:
        msg: "Name: {{ name }}"

    - name: Display Password
      debug:
        msg: "Password: {{ password }}"
      no_log: true

    - name: Display API Key
      debug:
        msg: "API Key: {{ apiKey }}"
      no_log: true